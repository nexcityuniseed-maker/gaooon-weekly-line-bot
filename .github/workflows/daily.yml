name: GaoooN 週次レポート → LINE配信

on:
  schedule:
    # 毎週月曜 JST 09:00 = 日曜 UTC 00:00
    # cron書式は分 時 日 月 曜日（UTC基準、0=日曜）
    - cron: "0 0 * * 1"
  workflow_dispatch:
    # 手動実行も可能（GitHubの「Actions」タブから "Run workflow"）

permissions:
  contents: read

jobs:
  send-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: スクリプトをraw URLから取得
        run: |
          REPO="${{ github.repository }}"
          REF="${{ github.sha }}"
          curl -sSLf -o daily_report.py "https://raw.githubusercontent.com/${REPO}/${REF}/daily_report.py"
          curl -sSLf -o requirements.txt "https://raw.githubusercontent.com/${REPO}/${REF}/requirements.txt"
          ls -la daily_report.py requirements.txt

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python依存ライブラリをインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Playwright Chromium をインストール
        run: |
          python -m playwright install --with-deps chromium

      - name: 日次レポート実行 → LINE配信
        env:
          GAOOON_EMAIL: ${{ secrets.GAOOON_EMAIL }}
          GAOOON_PASSWORD: ${{ secrets.GAOOON_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_GROUP_ID: ${{ secrets.LINE_GROUP_ID }}
          STORE_LOCATION: ${{ vars.STORE_LOCATION || 'chukasobanito_nagoya' }}
          STORE_NAME: ${{ vars.STORE_NAME || '中華そば二兎' }}
          SEND_MODE: send
        run: python daily_report.py

      - name: 失敗時のスクリーンショット保存（あれば）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshot
          path: |
            *.png
            playwright-report/
          retention-days: 7
