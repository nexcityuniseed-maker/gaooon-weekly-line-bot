name: GaoooN 週次レポート → LINE配信

on:
  schedule:
    # 毎週月曜 JST 11:00 = 月曜 UTC 02:00
    # cron書式は分 時 日 月 曜日（UTC基準、0=日曜、1=月曜）
    - cron: "0 2 * * 1"
  workflow_dispatch:
    inputs:
      mode:
        description: "実行モード（dry-run=LINE送信せず件数確認のみ／send=本番送信）"
        type: choice
        default: dry-run
        options:
          - dry-run
          - send

permissions:
  contents: read

jobs:
  send-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: スクリプトをraw URLから取得
        run: |
          REPO="${{ github.repository }}"
          REF="${{ github.sha }}"
          curl -sSLf -o daily_report.py "https://raw.githubusercontent.com/${REPO}/${REF}/daily_report.py"
          curl -sSLf -o requirements.txt "https://raw.githubusercontent.com/${REPO}/${REF}/requirements.txt"
          ls -la daily_report.py requirements.txt

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python依存ライブラリをインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Playwright Chromium をインストール
        run: |
          python -m playwright install --with-deps chromium

      # 二重送信ガード：対象週(先週月曜)をキーに送信済みマーカーをキャッシュ。
      # cronの遅延二重発火や手動送信との重複時、2回目以降は送信スキップされる。
      - name: 対象週キーを算出
        id: weekkey
        run: |
          WS=$(python -c "import datetime; t=datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=9))).date(); print((t-datetime.timedelta(days=t.weekday()+7)).isoformat())")
          echo "ws=$WS" >> "$GITHUB_OUTPUT"
          echo "report week_start=$WS"

      - name: 送信済みマーカーを復元/保存（週キー）
        uses: actions/cache@v4
        with:
          path: .last_sent.json
          key: sent-${{ steps.weekkey.outputs.ws }}

      - name: 日次レポート実行 → LINE配信
        env:
          GAOOON_EMAIL: ${{ secrets.GAOOON_EMAIL }}
          GAOOON_PASSWORD: ${{ secrets.GAOOON_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_GROUP_ID: ${{ secrets.LINE_GROUP_ID }}
          # STORE_LOCATION 未指定なら 5 店舗全部ループ実行（vars に値があるとそれ1店舗に絞り込み）
          STORE_LOCATION: ${{ vars.STORE_LOCATION }}
          # cron実行時は send、手動実行時はUIで選んだmode（デフォルトdry-run）
          SEND_MODE: ${{ github.event.inputs.mode || 'send' }}
        run: python daily_report.py

      - name: デバッグスクショ保存（常時、dry-runデバッグ用）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: |
            *.png
            debug/
            playwright-report/
          retention-days: 3
